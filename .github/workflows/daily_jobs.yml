name: Daily job alerts

on:
  schedule:
  - cron: "17 2 * * *"  # 02:17 UTC = 04:17/05:17 Israel time
  workflow_dispatch:

# Needed to commit state/seen_jobs.json back to the repo
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each run starts on a clean machine. The list of jobs already sent is
      # kept in the repo (state/seen_jobs.json) so the local HireMe task can
      # read it too. The Actions cache is only a fallback for the first run.
      - name: Restore seen jobs (cache fallback)
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Use the seen list stored in the repo
        run: |
          if [ -f state/seen_jobs.json ]; then cp state/seen_jobs.json seen_jobs.json; fi

      - name: Run job bot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_bot.py

      - name: Store seen list in the repo
        if: always() && hashFiles('seen_jobs.json') != ''
        run: |
          mkdir -p state
          cp seen_jobs.json state/seen_jobs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_jobs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update seen jobs"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save seen jobs (cache fallback)
        if: always() && hashFiles('seen_jobs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
